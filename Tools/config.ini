; Secret-Tools Configuration
; Personal Windows recovery & repair suite

[Remote]
; Repository used for auto-update checks and installer downloads.
; This repository is public, so no token or GitHub account is required.
api_endpoint = https://api.github.com/repos/MrSecret-Official/Secret-Tools-Win

[Logging]
enable_logging = true
log_directory = logs
log_filename = activity.log

[Features]
enable_admin = true
create_user = true
repair_sfc = true
repair_dism = true
view_status = true
view_info = true
check_disk = true
view_logs = true
health_report = true
