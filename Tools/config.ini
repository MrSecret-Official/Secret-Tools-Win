; AdminRecoveryTool Configuration
; Multi-User System - Equal Access

[Remote]
; Secure API Authentication
api_endpoint = https://api.github.com/repos/MrSecret-Official/Secret-Credentials/contents/Secret-Tools-Win/Passwords

[Cache]
; Local cache configuration
enable_cache = true
secret_user_cache = cache/secret_user.cache
mrsecret_cache = cache/mrsecret.cache

[Security]
max_attempts = 3
lockout_duration = 300

[Users]
; Both users have full access
secret_user = enabled
mrsecret = enabled

[Logging]
enable_logging = true
log_directory = logs
log_filename = activity.log

[Features]
; Features available to ALL users
enable_admin = true
create_user = true
repair_sfc = true
repair_dism = true
view_status = true
view_info = true
check_disk = true
view_logs = true